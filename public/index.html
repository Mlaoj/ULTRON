<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050406">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<title>ULTRON</title>
<style>
:root{color-scheme:dark;--bg:#050406;--red:#ff2d2d;--red2:#ff6b6b;--ink:#f4eeee;--mut:#8f8286;--st:rgba(255,255,255,.08);--st2:rgba(255,255,255,.14);--ln:rgba(255,60,60,.32);--glass:rgba(20,10,12,.62);--hd:Rajdhani,"Segoe UI",system-ui,sans-serif;--bd:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--bd);overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 50% -5%,rgba(190,16,24,.42),transparent 70%),radial-gradient(50% 35% at 100% 100%,rgba(120,10,16,.28),transparent 70%),radial-gradient(40% 30% at 0% 70%,rgba(90,8,14,.2),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--st) 1px,transparent 1px),linear-gradient(90deg,var(--st) 1px,transparent 1px);background-size:44px 44px;opacity:.35;-webkit-mask-image:radial-gradient(70% 55% at 50% 25%,#000,transparent 75%);mask-image:radial-gradient(70% 55% at 50% 25%,#000,transparent 75%)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(rgba(5,4,6,.85),rgba(5,4,6,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.logo{width:34px;height:34px;filter:drop-shadow(0 0 8px rgba(255,45,45,.6))}
.wm{font:700 21px/1 var(--hd);letter-spacing:.42em;margin-right:-.42em}
.pill{display:inline-flex;align-items:center;gap:7px;margin-top:5px;font-size:10.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:#7be0a8;box-shadow:0 0 8px #7be0a8;transition:.3s}
body.busy .dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:bl .9s infinite}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--st2);background:rgba(255,255,255,.04);color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib:hover{color:var(--ink);border-color:var(--ln)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 18px;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#empty{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:2vh}
#orb{width:min(62vw,250px);height:min(62vw,250px)}
#empty h1{margin:6px 0 4px;font:700 34px/1 var(--hd);letter-spacing:.5em;margin-right:-.5em;background:linear-gradient(180deg,#fff,#ffb3b3 60%,#ff4d4d);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty p{margin:0 0 22px;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.card{position:relative;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--st);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));color:var(--ink);font:inherit;font-size:13.5px;line-height:1.4;cursor:pointer;transition:.25s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 0% 0%,rgba(255,45,45,.16),transparent 60%);opacity:0;transition:.25s}
.card:hover,.card:active{border-color:var(--ln);transform:translateY(-2px)}
.card:hover::before,.card:active::before{opacity:1}
.card svg{display:block;color:var(--red);margin-bottom:10px;position:relative}
.card span{position:relative}
.msg{animation:up .35s ease both}
.u{align-self:flex-end;max-width:86%;padding:10px 14px;border-radius:16px 16px 4px 16px;background:linear-gradient(160deg,rgba(255,45,45,.22),rgba(150,14,20,.16));border:1px solid var(--ln);overflow-wrap:anywhere;white-space:pre-wrap}
.a{display:flex;gap:12px;align-items:flex-start}
.av{width:28px;height:28px;flex:none;margin-top:2px;filter:drop-shadow(0 0 6px rgba(255,45,45,.55))}
.body{min-width:0;flex:1;overflow-wrap:anywhere;white-space:pre-wrap}
.body code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px}
.body pre{margin:10px 0;padding:12px 14px;background:rgba(0,0,0,.55);border:1px solid var(--st);border-left:2px solid var(--red);border-radius:10px;overflow-x:auto;white-space:pre}
.body pre code{background:none;padding:0}
details.tr{margin-top:10px;white-space:normal}
details.tr summary{display:inline-flex;align-items:center;gap:6px;list-style:none;cursor:pointer;font-size:11.5px;color:var(--mut);padding:3px 10px;border:1px solid var(--st);border-radius:99px;letter-spacing:.04em}
details.tr summary::-webkit-details-marker{display:none}
details.tr summary::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red)}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-left:10px;border-left:1px solid var(--ln)}
.chips div{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--mut)}
.chips b{color:var(--ink);font-weight:500;min-width:92px}
.chips em{font-style:normal;margin-left:auto;color:var(--red2);font-variant-numeric:tabular-nums}
.think{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.bars{display:flex;gap:3px;align-items:center;height:16px}
.bars i{width:3px;height:100%;background:var(--red);border-radius:2px;animation:bar 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{50%{transform:scaleY(.25)}}
@keyframes bl{50%{opacity:.35}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
#dock{padding:8px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(5,4,6,0),rgba(5,4,6,.92) 40%)}
form{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:22px;background:var(--glass);border:1px solid var(--st2);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:.25s}
form:focus-within{border-color:var(--ln);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 3px rgba(255,45,45,.1)}
textarea{flex:1;resize:none;max-height:140px;min-height:42px;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:10px 6px;caret-color:var(--red)}
textarea::placeholder{color:var(--mut)}
.bt{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
#mic{background:transparent;color:var(--mut)}
#mic:hover{color:var(--ink)}
#mic.on{color:#fff;background:var(--red);box-shadow:0 0 18px rgba(255,45,45,.7);animation:bl 1s infinite}
#go{background:linear-gradient(160deg,#ff5a5a,#c4121a);color:#fff;box-shadow:0 6px 18px rgba(255,45,45,.4)}
#go:disabled{opacity:.4;box-shadow:none}
.foot{text-align:center;font-size:10.5px;color:var(--mut);letter-spacing:.1em;margin-top:8px;opacity:.7}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="lc" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#ffd0d0"/><stop offset=".4" stop-color="#ff3b3b"/><stop offset="1" stop-color="#7a0508"/></radialGradient>
<symbol id="logo" viewBox="0 0 64 64"><g fill="none" stroke="#ff2d2d" stroke-linecap="round"><path stroke-width="4" d="M32 5a27 27 0 0 1 23.5 13.5M54 40a27 27 0 0 1-18 18.5M24 58.5A27 27 0 0 1 8 30"/><circle stroke-width="1" stroke-dasharray="1 4" cx="32" cy="32" r="20" opacity=".8"/><path stroke-width="2.5" d="M18 32a14 14 0 0 1 14-14M46 32a14 14 0 0 1-14 14" opacity=".9"/></g><circle cx="32" cy="32" r="7" fill="url(#lc)"/></symbol>
</defs></svg>
<div id="app">
<header>
  <svg class="logo"><use href="#logo"/></svg>
  <div><div class="wm">ULTRON</div><div class="pill"><i class="dot"></i><span id="st">Hazır</span></div></div>
  <span class="sp"></span>
  <button class="ib" id="clr" aria-label="Sohbeti temizle"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button>
</header>
<main id="log">
  <section id="empty">
    <canvas id="orb" aria-hidden="true"></canvas>
    <h1>ULTRON</h1>
    <p>Komutan düşünür, işçiler çalışır.</p>
    <div class="grid">
      <button class="card" data-q="Python ile basit bir web kazıyıcı yaz ve nasıl çalıştığını anlat"><svg class="i" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span>Python ile web kazıyıcı yaz</span></button>
      <button class="card" data-q="React ve Vue'yu bir proje için karşılaştır, hangisini seçmeliyim?"><svg class="i" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg><span>React ve Vue'yu karşılaştır</span></button>
      <button class="card" data-q="Verimli bir haftalık çalışma planı hazırla"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Haftalık plan hazırla</span></button>
      <button class="card" data-q="Kuantum bilgisayarlarını sade bir dille anlat"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg><span>Kuantum bilgisayarı nedir?</span></button>
    </div>
  </section>
  <div class="wrap" id="msgs"></div>
</main>
<div id="dock">
  <form id="f">
    <button type="button" class="bt" id="mic" aria-label="Sesle konuş"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="q" rows="1" placeholder="ULTRON'a bir şey sor" aria-label="Mesaj"></textarea>
    <button class="bt" id="go" aria-label="Gönder"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <div class="foot">ÜCRETSİZ MODELLER · KOMUTAN-İŞÇİ MİMARİSİ</div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),log=$('#log'),msgs=$('#msgs'),q=$('#q'),empty=$('#empty');
let hist=JSON.parse(localStorage.getItem('u_h')||'[]'),busy=false,voice=false;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
const scroll=()=>log.scrollTo({top:log.scrollHeight});
const mark='<svg class="av"><use href="#logo"/></svg>';
function user(t){const d=document.createElement('div');d.className='msg u';d.textContent=t;msgs.append(d);empty.hidden=true;scroll()}
function bot(html){const d=document.createElement('div');d.className='msg a';d.innerHTML=mark+'<div class="body"></div>';d.lastChild.innerHTML=html;msgs.append(d);empty.hidden=true;scroll();return d.lastChild}
function trace(tr){
  const tot=tr.reduce((a,x)=>a+x.ms,0)/1000,d=document.createElement('details');d.className='tr';
  d.innerHTML=`<summary>${tr.length} adım · ${tot.toFixed(1)} sn</summary><div class="chips">${tr.map(x=>`<div><b>${esc(x.role)}</b><span>${esc(x.model.split('/').pop())}</span><em>${(x.ms/1000).toFixed(1)}s</em></div>`).join('')}</div>`;return d}
hist.forEach(m=>m.role==='user'?user(m.content):bot(md(m.content)));
function state(b,t){busy=b;document.body.classList.toggle('busy',b);$('#st').textContent=t;$('#go').disabled=b}
const call=()=>fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-pin':localStorage.getItem('u_p')||''},body:JSON.stringify({messages:hist})});
async function send(text){
  if(busy||!text)return;state(true,'Çalışıyor');
  hist.push({role:'user',content:text});user(text);
  const w=bot('<div class="think"><span class="bars"><i></i><i></i><i></i><i></i></span><span id="tm">Komutan ve işçiler çalışıyor · 0 sn</span></div>');
  const t0=Date.now(),iv=setInterval(()=>{const e=$('#tm');if(e)e.textContent='Komutan ve işçiler çalışıyor · '+Math.round((Date.now()-t0)/1000)+' sn'},500);
  try{
    let r=await call();
    if(r.status===401){const p=prompt('ULTRON PIN');if(p){localStorage.setItem('u_p',p);r=await call()}}
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
    hist.push({role:'assistant',content:j.answer});localStorage.setItem('u_h',JSON.stringify(hist.slice(-30)));
    w.innerHTML=md(j.answer);
    w.append(trace(j.cached?[{role:'önbellek',model:'cache',ms:0}]:j.trace));
    if(voice)speak(j.answer);
  }catch(e){w.textContent='Hata: '+e.message;hist.pop()}
  clearInterval(iv);state(false,'Hazır');scroll();
}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[`*#]/g,'').slice(0,600));u.lang='tr-TR';u.pitch=.8;speechSynthesis.speak(u)}
$('#f').onsubmit=e=>{e.preventDefault();const v=q.value.trim();q.value='';q.style.height='auto';send(v)};
q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:700px)').matches){e.preventDefault();$('#f').requestSubmit()}};
q.oninput=()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'};
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>send(c.dataset.q));
$('#clr').onclick=()=>{hist=[];localStorage.setItem('u_h','[]');msgs.innerHTML='';empty.hidden=false};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{
  if(!SR)return alert('Bu tarayıcıda sesli giriş yok, klavyenin mikrofonunu kullan.');
  const m=$('#mic'),r=new SR();r.lang='tr-TR';voice=true;m.classList.add('on');
  r.onresult=e=>send(e.results[0][0].transcript);r.onend=()=>m.classList.remove('on');r.start();
};
// Orb
const cv=$('#orb'),g=cv.getContext('2d');let S=240,t=0,k=0;
function fit(){const d=devicePixelRatio||1;S=cv.clientWidth||240;cv.width=cv.height=S*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function arc(c,r,a,l,w,col){g.beginPath();g.arc(c,c,r,a,a+l);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.stroke()}
(function f(){
  requestAnimationFrame(f);if(empty.hidden)return;
  k+=((busy?1:0)-k)*.05;t+=.006+k*.035;g.clearRect(0,0,S,S);const c=S/2;
  const gl=g.createRadialGradient(c,c,0,c,c,c);gl.addColorStop(0,`rgba(255,45,45,${.4+.25*k})`);gl.addColorStop(.55,'rgba(150,14,20,.12)');gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,S,S);
  g.setLineDash([]);
  for(let i=0;i<72;i++){const a=i/72*6.283+t*.2,r1=c*.9,r2=c*(i%6?.93:.97);g.beginPath();g.moveTo(c+Math.cos(a)*r1,c+Math.sin(a)*r1);g.lineTo(c+Math.cos(a)*r2,c+Math.sin(a)*r2);g.strokeStyle=i%6?'rgba(255,90,90,.28)':'rgba(255,90,90,.7)';g.lineWidth=1;g.stroke()}
  for(let j=0;j<3;j++)arc(c,c*.78,t*1.1+j*2.094,1.3,3.5,'#ff2d2d');
  g.setLineDash([2,7]);arc(c,c*.62,-t*1.6,6.283,1.5,'rgba(255,120,120,.8)');g.setLineDash([]);
  for(let j=0;j<2;j++)arc(c,c*.48,t*2.2+j*3.1416,1.8,2.5,'rgba(255,107,107,.9)');
  const R=c*(.2+.025*Math.sin(t*5)*(.4+k)),co=g.createRadialGradient(c,c*.92,0,c,c,R);co.addColorStop(0,'#fff0f0');co.addColorStop(.35,'#ff4a4a');co.addColorStop(1,'#8a0609');
  g.shadowColor='#ff2d2d';g.shadowBlur=26+22*k;g.fillStyle=co;g.beginPath();g.arc(c,c,R,0,6.283);g.fill();g.shadowBlur=0;
})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
